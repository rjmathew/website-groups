<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website Groups backup</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body.page { width: auto; max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; font-size: 14px; }
    .page header { padding: 0 0 14px; }
    .page header h1 { font-size: 18px; }
    .card { border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-top: 14px; }
    .card h2 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
    .card p { margin: 0 0 14px; color: var(--text2); }
    .card .btn { height: 32px; font-size: 13px; padding: 0 12px; }
    .check { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; cursor: pointer; }
    .check input { width: auto; margin: 0; accent-color: var(--accent); }
    .page #status { margin-top: 14px; border: 1px solid var(--success-border); border-radius: 8px; font-size: 13px; }
    .page #status.error { border-color: var(--danger-border); }
    #confirmReplace { margin-top: 14px; padding: 12px; border-radius: 8px;
                      background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger); }
    #confirmReplace .actions { margin-top: 10px; }
    #list .row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
    #list .row + .row { border-top: 1px solid var(--border); }
    #list .tile { width: 28px; height: 28px; }
    #list .tile svg.i { width: 15px; height: 15px; }
    #list .name { flex: 1; font-weight: 500; }
    #list .sub { white-space: nowrap; }
  </style>
</head>
<body class="page">
  <header>
    <span class="logo" data-icon="grid"></span>
    <h1>Back up and restore groups</h1>
  </header>

  <div id="status" class="hidden"><span></span><span id="statusText"></span></div>

  <section class="card">
    <h2>Export</h2>
    <p>Save all your groups to a file. Keep it as a backup, or use it to move your groups to another computer.</p>
    <button class="btn primary" id="export"><span data-icon="download"></span>Export groups</button>
  </section>

  <section class="card">
    <h2>Import</h2>
    <p>Load groups from a file you exported. A group with the same name as one you already have is updated, and the rest are added.</p>
    <label class="check"><input type="checkbox" id="replace">Replace all my groups with the ones in the file</label>
    <button class="btn" id="import"><span data-icon="upload"></span>Choose file and import</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
    <div id="confirmReplace" class="hidden">
      <div id="confirmText"></div>
      <div class="actions">
        <button class="btn danger" id="confirmYes">Replace groups</button>
        <button class="btn" id="confirmNo">Cancel</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>Your groups</h2>
    <div id="list"></div>
  </section>

  <script src="icons.js"></script>
  <script src="storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
